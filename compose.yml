# Everything rafilab.com serves, on one host. No port is published: the Cloudflare Tunnel reaches `edge` from inside.
name: lab

x-restart: &restart
  restart: unless-stopped

services:
  cloudflared:
    <<: *restart
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [edge]

  # One host name, one path per site: /, /dispatch/api/, /gatekeeper/api/, /lens/api/, /tiketa/, /tiketa/api/, /tiketa/agent/
  edge:
    <<: *restart
    image: caddy:2.11.7-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  postgres:
    <<: *restart
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tiketa
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d tiketa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7.4-alpine
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  lab-web:
    <<: *restart
    build:
      context: ./src/ai-engineering-lab
      args:
        VITE_PILAH_URL: ${SITE_URL}/dispatch/api
        VITE_GATEKEEPER_URL: ${SITE_URL}/gatekeeper/api
        VITE_LENS_URL: ${SITE_URL}/lens/api
        VITE_TIKETA_URL: ${SITE_URL}/tiketa/api
        VITE_TIKETA_SITE_URL: ${SITE_URL}/tiketa/

  tiketa-web:
    <<: *restart
    build:
      context: ./src/tiketa-app/web
      args:
        VITE_BASE_PATH: /tiketa/
        VITE_TIKETA_API_URL: ${SITE_URL}/tiketa/api
        VITE_TIKETA_AGENT_URL: ${SITE_URL}/tiketa/agent

  tiketa-api:
    <<: *restart
    build:
      context: ./src/tiketa-app
    environment:
      ENVIRONMENT: production
      API_KEYS: ${TIKETA_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      CORS_ORIGINS: '["${SITE_URL}"]'
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres:5432/tiketa
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: 60
      MCP_ENABLED: "true"
      # Visitors' own assistants book without a key, as one anonymous caller
      MCP_PUBLIC: "true"
      MCP_PUBLIC_RATE_LIMIT_PER_MINUTE: 300
      # Only `edge` can reach this container, so its forwarded client address is trusted
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  tiketa-agent:
    <<: *restart
    build:
      context: ./src/tiketa-booking-agent
    # One worker: the model stack is the largest thing in memory on this host
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8060 --proxy-headers --no-access-log --workers 1"
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: '["${SITE_URL}"]'
      BOOKING_API_URL: http://tiketa-api:8070
      BOOKING_API_KEY: ${TIKETA_API_KEY}
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres:5432/tiketa_agent
      REDIS_URL: redis://redis:6379/1
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      LLM_MODEL: deepseek/deepseek-flash
      LLM_REASONING_EFFORT: low
      # The day's model bill is capped here, and by the prepaid balance of this host's own key
      DAILY_TOKENS_PER_CALLER: 150000
      DAILY_TOKENS_TOTAL: 1000000
      PHOENIX_COLLECTOR_ENDPOINT: ""
      FORWARDED_ALLOW_IPS: "*"
      # Every visitor message is checked by Gatekeeper first, with the scope it keeps as "tiketa"
      GATEKEEPER_URL: http://gatekeeper-api:8020
      GATEKEEPER_API_KEY: ${GATEKEEPER_TRUSTED_KEY}
      GATEKEEPER_SCOPE_NAME: tiketa
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      tiketa-api: { condition: service_healthy }
      gatekeeper-api: { condition: service_healthy }

  lens-typesense:
    <<: *restart
    image: typesense/typesense:27.1
    command:
      - "--data-dir"
      - "/data"
      - "--api-key"
      - "${TYPESENSE_API_KEY}"
      - "--enable-cors"
    volumes:
      - lens-typesense-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q 'true' <&3"]
      interval: 5s
      timeout: 5s
      retries: 10

  dispatch-api:
    <<: *restart
    build:
      context: ./src/dispatch-system1-router
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8010 --proxy-headers --no-access-log --workers 1"
    environment:
      ENVIRONMENT: production
      TRIAGE_ENGINE: jev
      JEV_API_KEY: ${JEV_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      CORS_ORIGINS: '["${SITE_URL}"]'
      REDIS_URL: redis://redis:6379/2
      RATE_LIMIT_PER_MINUTE: 60
      DAILY_REQUESTS_PER_CALLER: 100
      DAILY_REQUESTS_TOTAL: 1000
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis: { condition: service_healthy }

  lens-api:
    <<: *restart
    build:
      context: ./src/lens-multimodal-search
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8030 --proxy-headers --no-access-log --workers 1"
    environment:
      ENVIRONMENT: production
      STORE_BACKEND: typesense
      TYPESENSE_URL: http://lens-typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_COLLECTION: lens_photographs
      VECTOR_SEARCH_EF: 200
      COLLECTION_DIR: /collection
      EMBEDDING_MODEL: gemini-embedding-2
      EMBEDDING_DIMENSIONS: 768
      MIN_PICTURE_SCORE: 0.35
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      CORS_ORIGINS: '["${SITE_URL}"]'
      REDIS_URL: redis://redis:6379/3
      RATE_LIMIT_PER_MINUTE: 60
      DAILY_REQUESTS_PER_CALLER: 150
      DAILY_REQUESTS_TOTAL: 1500
      DAILY_UPLOADS_PER_CALLER: 10
      DAILY_UPLOADS_TOTAL: 100
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./data/lens:/collection
    depends_on:
      redis: { condition: service_healthy }
      lens-typesense: { condition: service_healthy }

  gatekeeper-api:
    <<: *restart
    build:
      context: ./src/gatekeeper-llm-gateway
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8020 --proxy-headers --no-access-log --workers 1"
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: '["${SITE_URL}"]'
      UPSTREAM_BASE_URL: https://api.deepseek.com
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      UPSTREAM_MODEL: deepseek-flash
      INJECTION_GUARD: jev
      JEV_API_KEY: ${JEV_API_KEY}
      JEV_MODEL: jev-1.14.0
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      BLOCK_FROM_INJECTION_PROBABILITY: 0.90
      BLOCK_FROM_OFF_TOPIC_PROBABILITY: 0.90
      MASK_IDENTIFIERS_ENABLED: "false"
      # Tiketa's agent uses this key: it skips the daily caps meant for visitors
      TRUSTED_API_KEYS: ${GATEKEEPER_TRUSTED_KEY}
      NAMED_SCOPES: '{"tiketa": "booking cinema tickets at Tiketa: films, showtimes, seats, prices and bookings, including short replies to the assistant such as greetings, numbers, yes or no, days, times, seat ids and names"}'
      AGENT_GUARD_ENABLED: "true"
      REDIS_URL: redis://redis:6379/4
      RATE_LIMIT_PER_MINUTE: 120
      DAILY_REQUESTS_PER_CALLER: 40
      DAILY_REQUESTS_TOTAL: 300
      FORWARDED_ALLOW_IPS: "*"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=3)\""]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  lens-typesense-data:
